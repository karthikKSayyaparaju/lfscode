<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses • LearnFromScratch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .rail-link { text-decoration: underline; text-underline-offset: 4px; }
    .rail-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <script>
    window.__HEADER_CONFIG__ = {
      navLinks: [
        { href: "/login/dashboard.html", label: "Dashboard" },
        { href: "/login/courses.html", label: "Courses" },
      ],
      actionButtons: [
        { href: "/login/dashboard.html", label: "Back to dashboard", className: "btn btn-outline" },
      ],
      hideAuthLink: true,
    };
  </script>
  <div id="headerMount"></div>

  <div class="container">
    <div style="padding: 12px 0 6px;">
      <h1 id="courseTitle" style="margin:0; font-weight:200;">Course</h1>
      <p id="courseLede" style="margin:6px 0 0; opacity:.82; font-weight:300;">Loading course details...</p>
    </div>

    <div class="courses-shell">
      <aside class="rail">
        <h3><a id="courseOverviewLink" class="rail-link" href="#">Course overview</a></h3>
        <p id="courseSummary">Loading...</p>
        <div class="pill-row" id="pillRow"></div>
        <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
          <a class="btn btn-outline" id="startTopic" href="#">Start first topic</a>
          <a class="btn btn-solid" id="practiceLink" href="#">Practice challenges</a>
        </div>
      </aside>

      <section class="topics" id="topicsList">
        <h2>Topics</h2>
      </section>

      <aside class="right-rail">
        <h3>Progress</h3>
        <p>Track completion as you go.</p>
        <div id="progressList" style="display:flex; flex-direction:column; gap:8px; font-weight:200; opacity:.82;">
        </div>
      </aside>
    </div>
  </div>

  <script src="/script.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const selectedCourse = params.get("course") || "python";

    async function loadCourse() {
      const courseRes = await fetch("/data/courses.json", { cache: "no-cache" });
      if (!courseRes.ok) return;
      const { courses = [] } = await courseRes.json();
      const course = courses.find((c) => c.id === selectedCourse) || courses[0];
      if (!course) return;

      document.getElementById("courseTitle").textContent = course.title;
      document.getElementById("courseLede").textContent =
        "Pick a topic to open a dedicated page with description + runnable code.";
      document.getElementById("courseSummary").textContent = course.summary || "";

      const overviewLink = document.getElementById("courseOverviewLink");
      if (overviewLink) {
        overviewLink.href = `/login/course-overview.html?course=${encodeURIComponent(course.id)}`;
        overviewLink.setAttribute("aria-label", `${course.title} overview`);
      }

      const pillRow = document.getElementById("pillRow");
      pillRow.innerHTML = "";
      (course.tags || []).forEach((tag) => {
        const span = document.createElement("span");
        span.className = "pill-tag";
        span.textContent = tag;
        pillRow.appendChild(span);
      });

      const manifestUrl = course.topicsManifest || `/data/topics/${course.id}/index.json`;
      const manifestRes = await fetch(manifestUrl, { cache: "no-cache" });
      if (!manifestRes.ok) return;
      const manifest = await manifestRes.json();
      const topicFiles = manifest.topicFiles || [];
      const basePath = manifest.basePath || `/data/topics/${course.id}/`;

      const lessons = (
        await Promise.all(
          topicFiles.map(async (file) => {
            const res = await fetch(`${basePath}${file}`, { cache: "no-cache" });
            if (!res.ok) return null;
            return res.json();
          })
        )
      ).filter(Boolean);

      const topicsList = document.getElementById("topicsList");
      topicsList.innerHTML = "<h2>Topics</h2>";
      const fragment = document.createDocumentFragment();
      lessons.forEach((lesson) => {
        const card = document.createElement("article");
        card.className = "topic-card";
        card.innerHTML = `
          <div>
            <p class="topic-title">${lesson.title}</p>
            <p class="topic-desc">${lesson.desc}</p>
            <div class="topic-meta">
              <span>${lesson.difficulty || ""}</span>
            </div>
          </div>
          <div class="topic-link">
            <a href="/login/course-topic.html?course=${encodeURIComponent(course.id)}&lesson=${encodeURIComponent(lesson.id)}">Open</a>
          </div>
        `;
        fragment.appendChild(card);
      });
      topicsList.appendChild(fragment);

      const progressList = document.getElementById("progressList");
      progressList.innerHTML = "";
      lessons.forEach((lesson) => {
        const span = document.createElement("span");
        span.textContent = lesson.title;
        progressList.appendChild(span);
      });

      const startBtn = document.getElementById("startTopic");
      const practiceBtn = document.getElementById("practiceLink");
      const firstLesson = lessons[0];
      const practiceLesson = lessons.find((l) => l.id.toLowerCase().includes("practice"));

      if (firstLesson && startBtn) {
        startBtn.href = `/login/course-topic.html?course=${encodeURIComponent(course.id)}&lesson=${encodeURIComponent(firstLesson.id)}`;
      }
      if (practiceBtn) {
        const targetLesson = practiceLesson || firstLesson;
        if (targetLesson) {
          practiceBtn.href = `/login/course-topic.html?course=${encodeURIComponent(course.id)}&lesson=${encodeURIComponent(targetLesson.id)}`;
        } else {
          practiceBtn.style.display = "none";
        }
      }
    }

    document.addEventListener("DOMContentLoaded", loadCourse);
  </script>
</body>
</html>
