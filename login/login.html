<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - LearnFromScratch</title>
  <link rel="stylesheet" href="../styles.css" />

</head>

<body class="login-page">
  <a class="btn btn-outline go-home" href="/" aria-label="Go to Home">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
  </a>
  <main class="page">
    <section class="card" aria-label="Login card">
      <header class="header">
        <div class="logo" aria-hidden="true"></div>
        <h1>Login to Unlock new learning</h1>
        <p>Log in to continue learning with <span>LearnFromScratch</span>.</p>
      </header>

      <form class="form" action="/login-password" method="POST" autocomplete="on">
        <label class="field">
          <span>Username</span>
          <input type="text" name="username" placeholder="Enter your username" required />
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" name="password" placeholder="Enter your password" required />
        </label>

        <div class="row">
          <label class="checkbox">
            <input type="checkbox" name="remember" />
            <span>Remember me</span>
          </label>

          <a class="link" href="/forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <div class="google-login-container">
        <a href="/auth/google" class="btn-google-icon" role="button" aria-label="Sign in with Google">
          <img src="/svg_files/google_sigin_G_logo.svg" width="200" height="75" alt="Google logo" />
        </a>
      </div>
      <footer class="footer">
        <p>New here? <a class="link" href="/signup">Create an account</a></p>
      </footer>
    </section>
  </main>
</body>

</html>
